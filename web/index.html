<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ภาพรวม & ติดตามงาน · HL Welfare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script>
      // ธีม + ตรวจการเข้าสู่ระบบก่อนแสดงหน้า (ยังไม่ login → ไปหน้า login.html)
      try {
        if (localStorage.getItem('hl-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
        var s = JSON.parse(sessionStorage.getItem('hl-session') || localStorage.getItem('hl-session') || 'null');
        // ขนาดตัวอักษรของระบบ (app/fontSize.js) — ต่อผู้ใช้ ต่อเบราว์เซอร์
        var f = Number(localStorage.getItem('hl-font:' + (s && s.username)) || localStorage.getItem('hl-font') || 100);
        if (f !== 100 && f >= 80 && f <= 150) document.documentElement.style.setProperty('--ui-zoom', f / 100);
        if (!s || s.expiresAt < Date.now()) location.replace('login.html?next=' + encodeURIComponent((location.pathname.split('/').pop() || 'index.html') + location.search));
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- หน้าเดียว ไม่มีแท็บ: สรุป (bento) → คิวงาน (#queue) → บันทึกกิจกรรม (#activity) · ลิงก์เก่า ?tab=queue|activity = เลื่อนไปส่วนนั้น · คิวงานรับ ?severity= &kind= -->
    <main id="page" class="page">
      <div class="page-head">
        <div>
          <h1 id="greeting">สวัสดี 👋</h1>
          <p id="today">กำลังโหลด…</p>
        </div>
        <div class="page-actions">
          <span class="row small muted"><span class="live-dot" id="live-dot"></span><span id="updated" class="hide-sm"></span></span>
          <label class="row" style="font-size:13px">
            <button type="button" class="switch" role="switch" aria-checked="true" aria-label="รีเฟรชอัตโนมัติ" id="auto"></button>
            <span>อัตโนมัติ<span class="hide-sm"> (60 วิ)</span></span>
          </label>
          <button class="btn btn-sm" id="refresh" title="รีเฟรช" aria-label="รีเฟรช"><i data-icon="refresh-cw"></i><span class="hide-sm">รีเฟรช</span></button>
        </div>
      </div>

      <!-- ===== สรุป (bento — ช่องขนาดต่างกันตามความสำคัญ · ไม่บังคับสูงพอดีจอ) ===== -->
      <div class="dash-section" id="summary">
        <div class="bento" id="bento">
          <section class="tile t-cycle" id="t-cycle" aria-label="รอบแจ้งประกันถัดไป"><div class="skeleton sk-block"></div></section>
          <section class="tile t-urgent" id="t-urgent" aria-label="แจ้งออกทันทีค้าง"><div class="skeleton sk-line"></div></section>
          <section class="tile t-uniform" id="t-uniform" aria-label="ชุดฟอร์มค้างแจก"><div class="skeleton sk-line"></div></section>
          <section class="tile t-people" id="t-people" aria-label="พนักงานปัจจุบัน"><div class="skeleton sk-block"></div></section>
          <section class="tile t-queue" id="t-queue" aria-label="คิวงาน"><div class="skeleton sk-block"></div></section>
          <section class="tile t-upcoming" aria-label="จะครบสิทธิใน 30 วัน">
            <header class="tile-head">
              <span class="tile-ic"><i data-icon="calendar-clock"></i></span>
              <div class="grow"><h2>จะครบสิทธิประกันกลุ่มใน 30 วัน</h2><p>แจ้งเข้าในรอบถัดไปหลังครบสิทธิ</p></div>
            </header>
            <div id="upcoming"></div>
          </section>
        </div>
      </div>

      <!-- ===== คิวงาน ===== -->
      <div class="dash-section" id="queue">
        <section class="card">
          <header class="card-head">
            <div class="card-title">
              <span class="card-icon"><i data-icon="clipboard-list"></i></span>
              <div>
                <h2>คิวงาน <span id="task-count"></span></h2>
                <p>ทุกเรื่องที่ต้องทำ เรียงตามความเร่งด่วน แล้วตามจำนวนวันที่เลยกำหนด</p>
              </div>
            </div>
            <div class="input-icon" style="width:min(320px,100%)">
              <i data-icon="search"></i>
              <input class="input" id="q" placeholder="ค้นหาพนักงาน หรือ ชื่องาน" aria-label="ค้นหางาน" />
            </div>
          </header>
          <div class="chips" id="kinds" role="group" aria-label="กรองตามระดับและประเภทงาน" style="padding:12px 16px;border-bottom:1px solid var(--border)"></div>
          <div id="tasks"></div>
        </section>
      </div>

      <!-- ===== บันทึกกิจกรรม ===== -->
      <div class="dash-section" id="activity">
        <section class="card">
          <header class="card-head">
            <div class="card-title">
              <span class="card-icon"><i data-icon="activity"></i></span>
              <div>
                <h2>บันทึกกิจกรรม <span id="today-count"></span></h2>
                <p>ใคร ทำอะไร เมื่อไร — ทุกการเพิ่ม/แก้ไข/ลบ/ส่งแจ้ง</p>
              </div>
            </div>
            <select id="entity" data-combobox data-size="sm" aria-label="กรองกิจกรรม" class="combo" style="width:160px">
              <option value="">ทุกประเภท</option>
              <option value="EMPLOYEE">พนักงาน</option>
              <option value="SITE">หน่วยงาน</option>
              <option value="INSURANCE_BATCH">ประกันกลุ่ม</option>
              <option value="UNIFORM_ISSUE">ชุดฟอร์ม</option>
            </select>
          </header>
          <div id="feed" class="card-body"></div>
          <div class="card-foot hidden" id="more-wrap" style="text-align:center">
            <button class="btn btn-ghost btn-sm" id="more">โหลดเพิ่ม</button>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="assets/js/pages/dashboard.js"></script>
  </body>
</html>
