<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>กองทุนสำรองเลี้ยงชีพ · HL Welfare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script>
      // ธีม + ตรวจการเข้าสู่ระบบก่อนแสดงหน้า (ยังไม่ login → ไปหน้า login.html)
      try {
        if (localStorage.getItem('hl-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
        var s = JSON.parse(sessionStorage.getItem('hl-session') || localStorage.getItem('hl-session') || 'null');
        if (!s || s.expiresAt < Date.now()) location.replace('login.html?next=' + encodeURIComponent((location.pathname.split('/').pop() || 'index.html') + location.search));
      } catch (e) {}
    </script>
  </head>
  <body>
    <main id="page" class="page fit">
      <div class="page-head">
        <div>
          <h1>กองทุนสำรองเลี้ยงชีพ</h1>
          <p>สิทธิสมาชิก ยอดหักสะสม/สมทบ และ % สิทธิในเงินสมทบ (vesting)</p>
        </div>
        <div class="page-actions">
          <button class="btn" id="export"><i data-icon="download"></i> ส่งออก CSV</button>
        </div>
      </div>

      <div id="vesting-alert" class="mb hidden"></div>
      <div id="stats" class="grid grid-3 stats mb"></div>

      <section class="card fill">
        <div id="tabs"></div>
        <div id="list" class="fill-body"></div>
      </section>
    </main>
    <script type="module" src="assets/js/pages/pvd.js"></script>
  </body>
</html>
