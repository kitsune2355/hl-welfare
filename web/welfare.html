<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>สวัสดิการเพิ่มเติม · HL Welfare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script>
      // ธีม + ตรวจการเข้าสู่ระบบก่อนแสดงหน้า (ยังไม่ login → ไปหน้า login.html)
      try {
        if (localStorage.getItem('hl-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
        var s = JSON.parse(sessionStorage.getItem('hl-session') || localStorage.getItem('hl-session') || 'null');
        // ขนาดตัวอักษรของระบบ (app/fontSize.js) — ต่อผู้ใช้ ต่อเบราว์เซอร์
        var f = Number(localStorage.getItem('hl-font:' + (s && s.username)) || localStorage.getItem('hl-font') || 100);
        if (f !== 100 && f >= 80 && f <= 150) document.documentElement.style.setProperty('--ui-zoom', f / 100);
        if (!s || s.expiresAt < Date.now()) location.replace('login.html?next=' + encodeURIComponent((location.pathname.split('/').pop() || 'index.html') + location.search));
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- welfare.html?id=<รหัสสวัสดิการ>&tab=history — สวัสดิการเพิ่มเติมที่ HR สร้างเอง (ตั้งค่าที่ welfare-setup.html) -->
    <main id="page" class="page fit">
      <div class="page-head" id="head">
        <div><div class="skeleton" style="height:48px;width:320px"></div></div>
      </div>

      <div id="notice"></div>
      <div id="tabs"></div>

      <!-- แท็บ: ผู้มีสิทธิ์ -->
      <section class="card fill" id="tab-roster">
        <header class="card-head">
          <div class="card-title">
            <span class="card-icon"><i data-icon="users"></i></span>
            <div>
              <h2>ผู้มีสิทธิ์</h2>
              <p id="roster-hint">พนักงานที่ตรงเงื่อนไข — กด “บันทึกการให้” เมื่อให้สวัสดิการแล้ว</p>
            </div>
          </div>
          <div class="chips" id="filters" role="group" aria-label="กรองตามสถานะ"></div>
        </header>
        <div id="roster" class="fill-body"></div>
      </section>

      <!-- แท็บ: ประวัติการให้ -->
      <section class="card fill hidden" id="tab-history">
        <header class="card-head">
          <div class="card-title">
            <span class="card-icon"><i data-icon="history"></i></span>
            <div>
              <h2>ประวัติการให้</h2>
              <p>บันทึกผิดกดยกเลิกได้ — รอบนั้นกลับเป็น “ค้างให้”</p>
            </div>
          </div>
        </header>
        <div id="history" class="fill-body"></div>
      </section>
    </main>
    <script type="module" src="assets/js/pages/welfare.js"></script>
  </body>
</html>
