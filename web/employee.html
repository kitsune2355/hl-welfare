<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>รายละเอียดพนักงาน · HL Welfare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script>
      // ธีม + ตรวจการเข้าสู่ระบบก่อนแสดงหน้า (ยังไม่ login → ไปหน้า login.html)
      try {
        if (localStorage.getItem('hl-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
        var s = JSON.parse(sessionStorage.getItem('hl-session') || localStorage.getItem('hl-session') || 'null');
        if (!s || s.expiresAt < Date.now()) location.replace('login.html?next=' + encodeURIComponent((location.pathname.split('/').pop() || 'index.html') + location.search));
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- เปิดด้วย employee.html?id=รหัสในระบบ -->
    <main id="page" class="page">
      <nav class="breadcrumb" aria-label="breadcrumb"><a href="employees.html">พนักงาน</a> <i data-icon="chevron-right"></i> <span id="crumb">…</span></nav>
      <div class="page-head" id="head">
        <div class="skeleton" style="height:56px;width:320px"></div>
      </div>

      <section class="card mb"><div class="card-body" id="info"><div class="skeleton sk-line"></div></div></section>

      <div id="insurance"><div class="skeleton sk-block"></div></div>

      <div class="mt" id="uniform"></div>

      <section class="card mt">
        <header class="card-head">
          <div class="card-title">
            <span class="card-icon"><i data-icon="history"></i></span>
            <div>
              <h2>ประวัติการเปลี่ยนแปลง</h2>
              <p>บันทึกกิจกรรมของพนักงานคนนี้</p>
            </div>
          </div>
        </header>
        <div id="activity"></div>
      </section>
    </main>
    <script type="module" src="assets/js/pages/employee.js"></script>
  </body>
</html>
