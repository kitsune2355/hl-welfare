<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>พนักงาน · HL Welfare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script>
      // ธีม + ตรวจการเข้าสู่ระบบก่อนแสดงหน้า (ยังไม่ login → ไปหน้า login.html)
      try {
        if (localStorage.getItem('hl-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
        var s = JSON.parse(sessionStorage.getItem('hl-session') || localStorage.getItem('hl-session') || 'null');
        // ขนาดตัวอักษรของระบบ (app/fontSize.js) — ต่อผู้ใช้ ต่อเบราว์เซอร์
        var f = Number(localStorage.getItem('hl-font:' + (s && s.username)) || localStorage.getItem('hl-font') || 100);
        if (f !== 100 && f >= 80 && f <= 150) document.documentElement.style.setProperty('--ui-zoom', f / 100);
        if (!s || s.expiresAt < Date.now()) location.replace('login.html?next=' + encodeURIComponent((location.pathname.split('/').pop() || 'index.html') + location.search));
      } catch (e) {}
    </script>
  </head>
  <body>
    <main id="page" class="page fit">
      <div class="page-head">
        <div>
          <h1>พนักงาน</h1>
          <p>เพิ่ม / แก้ไข / บันทึกพ้นสภาพ / ปิดใช้งาน ในตารางเหมือน Excel แล้วกด “บันทึก” (สี: เขียว = เพิ่ม · เหลือง = แก้ไข · จาง = ปิดใช้งาน)</p>
        </div>
      </div>

      <section class="card fill">
        <!-- ตัวกรอง: ช่องค้นหา + แท็กกรองเร็ว · ค่าถูกเก็บใน URL (?q=&status=&type=&company=) -->
        <form class="filters stack" id="filters">
          <div class="input-icon search-box">
            <i data-icon="search"></i>
            <input class="input" type="search" name="q" placeholder="ค้นหารหัส หรือ ชื่อ-สกุล" aria-label="ค้นหา" autocomplete="off" />
          </div>
          <!-- แท็กสร้างจาก TAG_GROUPS ใน pages/employees.js -->
          <div class="quick-tags" id="quick-tags" role="group" aria-label="กรองเร็ว"></div>
        </form>

        <div id="grid" class="fill-body"></div>
      </section>
    </main>
    <script type="module" src="assets/js/pages/employees.js"></script>
  </body>
</html>
