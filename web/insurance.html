<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ประกันกลุ่ม · HL Welfare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script>
      // ธีม + ตรวจการเข้าสู่ระบบก่อนแสดงหน้า (ยังไม่ login → ไปหน้า login.html)
      try {
        if (localStorage.getItem('hl-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
        var s = JSON.parse(sessionStorage.getItem('hl-session') || localStorage.getItem('hl-session') || 'null');
        if (!s || s.expiresAt < Date.now()) location.replace('login.html?next=' + encodeURIComponent((location.pathname.split('/').pop() || 'index.html') + location.search));
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- insurance.html?cycle=YYYY-MM-05&tab=urgent|in|out|history -->
    <main id="page" class="page fit">
      <div class="page-head">
        <div>
          <h1>ประกันกลุ่ม</h1>
          <p id="cycle-info">ส่งออกไฟล์แจ้งเข้า/ออกตามแบบฟอร์มของบริษัทประกัน ทุกวันที่ 5 ของเดือน</p>
        </div>
        <div class="page-actions">
          <select id="cycle" data-combobox aria-label="เลือกรอบ" class="combo" style="width:230px"></select>
          <button class="btn btn-primary" id="export"><i data-icon="file-spreadsheet"></i> ส่งออกไฟล์แจ้งประกัน</button>
        </div>
      </div>

      <!-- แท็บ: แจ้งออกทันที / แจ้งเข้า / แจ้งออก / ประวัติ — ตัวเลข = จำนวนรอส่ง -->
      <div id="tabs"></div>

      <!-- เนื้อหาของแต่ละแท็บ (สร้างจาก JS) — แสดงทีละแท็บ ยืดเต็มจอ -->
      <div id="sections" class="panel fill"></div>
    </main>
    <script type="module" src="assets/js/pages/insurance.js"></script>
  </body>
</html>
