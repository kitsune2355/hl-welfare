<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ประกันกลุ่ม · HL Welfare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script>
      try { if (localStorage.getItem('hl-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
    </script>
  </head>
  <body>
    <!-- insurance.html?cycle=YYYY-MM-05 = เลือกรอบ -->
    <main id="page" class="page">
      <div class="page-head">
        <div>
          <h1>ประกันกลุ่ม</h1>
          <p>สร้างรายการแจ้งเข้า/ออกทุกวันที่ 5 ของเดือน และแจ้งออกทันทีกรณีเลิกจ้าง</p>
        </div>
        <div class="page-actions">
          <select id="cycle" data-combobox aria-label="เลือกรอบ" class="combo" style="width:230px"></select>
          <button class="btn" id="export"><i data-icon="download"></i> ส่งออก CSV</button>
        </div>
      </div>
      <p class="small muted" id="cycle-info" style="margin:-12px 0 24px"></p>

      <div class="stack">
        <!-- 3 ส่วน: แจ้งออกทันที / แจ้งเข้า / แจ้งออก (สร้างจาก JS ตามข้อมูลรอบ) -->
        <div id="sections" class="stack"></div>

        <section class="card">
          <header class="card-head">
            <div class="card-title">
              <span class="card-icon"><i data-icon="history"></i></span>
              <div><h2>ประวัติการส่งแจ้ง</h2></div>
            </div>
          </header>
          <div id="batches"></div>
        </section>
      </div>
    </main>
    <script type="module" src="assets/js/pages/insurance.js"></script>
  </body>
</html>
