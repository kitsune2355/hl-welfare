<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เงื่อนไขสวัสดิการ · HL Welfare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <link rel="stylesheet" href="assets/css/rules.css" />
    <script>
      // ธีม + ตรวจการเข้าสู่ระบบก่อนแสดงหน้า (ยังไม่ login → ไปหน้า login.html)
      try {
        if (localStorage.getItem('hl-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
        var s = JSON.parse(sessionStorage.getItem('hl-session') || localStorage.getItem('hl-session') || 'null');
        if (!s || s.expiresAt < Date.now()) location.replace('login.html?next=' + encodeURIComponent((location.pathname.split('/').pop() || 'index.html') + location.search));
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- rules.html?tab=insurance|uniform|settings|pending -->
    <main id="page" class="page fit">
      <div class="page-head">
        <div>
          <h1>เงื่อนไขสวัสดิการ</h1>
          <p>แก้กฎได้ทันที หรือตั้งล่วงหน้าด้วย “วันที่มีผล” — การแจ้งประกันและการแจกชุดที่ทำไปแล้วไม่เปลี่ยนตาม</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" id="add" style="display:none"><i data-icon="plus"></i> <span id="add-label">เพิ่มกฎ</span></button>
        </div>
      </div>

      <div id="notice"></div>
      <div id="tabs"></div>
      <section class="card fill" id="panel">
        <div id="content" class="fill-body"><div class="skeleton sk-block"></div></div>
      </section>
    </main>
    <script type="module" src="assets/js/pages/rules.js"></script>
  </body>
</html>
