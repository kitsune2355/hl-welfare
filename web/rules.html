  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เงื่อนไขสวัสดิการ · HL Welfare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script>
      try { if (localStorage.getItem('hl-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
    </script>
  </head>
  <body>
    <!-- rules.html?tab=insurance|pvd|uniform|settings|open -->
    <main id="page" class="page">
      <div class="page-head">
        <div>
          <h1>เงื่อนไขสวัสดิการ</h1>
          <p>อ้างอิงไฟล์ “เงื่อนไขสวัสดิการ 15.10.69” — ดูอย่างเดียว (แก้ไขผ่านหน้าจอในเฟส 3)</p>
        </div>
      </div>

      <div id="tabs"></div>
      <div id="content"><div class="skeleton sk-block"></div></div>

      <!-- ประเด็นที่ต้องยืนยันกับ HR — แก้ข้อความในไฟล์นี้ได้โดยตรง -->
      <template id="open-questions">
        <li>“ทำงานครบ 30/120 วัน” นับวันปฏิทินหรือวันทำงาน? นับวันเริ่มงานเป็นวันที่ 1 ไหม? (ระบบตอนนี้: วันเริ่มงาน + N วันปฏิทิน)</li>
        <li>ครบสิทธิหลังวันที่ 5 → เข้ารอบเดือนถัดไปใช่ไหม?</li>
        <li>อายุ 65 ตรวจเฉพาะตอนแจ้งเข้า หรือต้องแจ้งออกเมื่ออายุครบ 65 ระหว่างเป็นสมาชิกด้วย?</li>
        <li>ขาดงาน 3 วันแล้วกลับมาทำงาน → แจ้งเข้าใหม่ + นับอายุงานใหม่ไหม?</li>
        <li>พนักงานรายวัน CNS / CIC / PRO ได้ประกันกลุ่มไหม (ไฟล์ระบุแค่ HL, AS)?</li>
        <li>PVD: ตาราง vesting จริง และนิยาม “ลาออกถูกต้องตามระเบียบ”</li>
        <li>ชุดฟอร์มส่วนกลาง: ช่อง “วันเริ่มงาน” ว่าง = ไม่ได้จนกว่าจะผ่านทดลองงาน ใช่ไหม?</li>
        <li>ช่างทีมโมบาย “2+1” = ชุดช่าง 2 + โปโล 1 ใช่ไหม?</li>
        <li>แจกชุดประจำปีเดือนไหน และต้องทำงานครบกี่เดือนก่อนรอบแจก?</li>
        <li>CIC ระดับ 6 ขึ้นไป ได้ชุดฟอร์มกี่ตัว?</li>
        <li>แม่บ้าน CNS และพนักงานรายวัน ได้ชุดฟอร์มไหม?</li>
        <li>ระดับพนักงาน “6 ขึ้นไป” สูงสุดถึงระดับเท่าไร?</li>
      </template>
    </main>
    <script type="module" src="assets/js/pages/rules.js"></script>
  </body>
</html>
